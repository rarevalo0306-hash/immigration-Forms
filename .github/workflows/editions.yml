name: Ediciones USCIS

# Every Monday, compares each form's edition in Camino with its uscis.gov page and opens (or
# updates) one issue when an edition changed. It can also be run by hand from the Actions tab.
on:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: check
        run: npm run check-editions
      - name: Open or update the issue
        if: steps.check.outputs.changed != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create ediciones-uscis --color D93F0B --description "USCIS publicó una edición nueva" 2>/dev/null || true
          number=$(gh issue list --label ediciones-uscis --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file edition-report.md
          else
            gh issue create --title "USCIS publicó ediciones nuevas de formularios" --label ediciones-uscis --body-file edition-report.md
          fi
